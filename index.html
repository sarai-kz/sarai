
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SARAI – Жөндеу платформасы</title>
</head>
<body>
  <h1>SARAI</h1>
  <h2>Үйіңіздің жаңа жолы</h2>
  <p>Жөндеу құнын есептеңіз және сенімді шебер табыңыз.</p>

  <button onclick="esepteu()">Жөндеуді есептеу</button>
  <button onclick="sheber()">Шебер табу</button>

  <script>
    function esepteu() {
      let a = prompt("Үйдің ауданы қанша м²?");
      if (a !== null && Number(a) > 0) {
        alert("Болжамды құны: " + (Number(a) * 15000).toLocaleString() + " ₸");
      }
    }

    function sheber() {
      alert("Шебер іздеу бөлімі әзірленуде!");
    }
  </script>
</body>
</html>
